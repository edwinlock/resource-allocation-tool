<body>
    <div class="container px-0 px-lg-3">
        <div class="row app-container mx-0">
            <div class="col-12 px-2 px-lg-3">
                <div class="intro-text my-3">
                    <p id="scenarios-infotext">Se le mostrarán <span id="total-scenarios">6</span> escenarios distintos.</p>
                </div>
                <div class="progress my-2" role="progressbar" aria-label="Basic example" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar" style="width: 0%">
                        <span id="progress-text">-/-</span>
                    </div>
                </div>

                <div class="settings-area mt-3 mb-0">
                    <div class="row g-3 align-items-center">
                        <div class="col-auto">
                            <label for="graph-type-select" class="form-label">Tipo de Gráfico</label>
                        </div>
                        <div class="col-auto">
                            <select id="graph-type-select" class="form-select">
                                <option value="multi-bar" selected>Gráfico de Barras</option>
                                <!-- <option value="line">Gráfico de Líneas</option> ---->
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="chart-section">
                    <h3 id="outcome-chart-title">Número de Sesiones</h3>
                    <canvas id="multi-bar-chart-canvas" class="chart-canvas"></canvas>
                    <canvas id="line-chart-canvas" class="chart-canvas"></canvas>
                </div>


                <div class="investment-section">
                    <h3 id="distribution-prompt">Escoge la Distribución</h3>

                    <div class="child-slider">
                        <div>
                            <span><span class="child1-name" id="child1-name">Hijo/a 1</span>: <span id="child1-display">0</span> <span id="resource-label-1">fichas</span></span>
                            <span><span class="child2-name" id="child2-name">Hijo/a 2</span>: <span id="child2-display">9</span> <span id="resource-label-2">fichas</span></span>
                        </div>
                        <input type="range" min="0" max="9" value="0" class="slider" id="investment-slider">
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button type="button" class="btn btn-secondary" id="prevButton" style="display: none;">
                        Escenario Previo
                    </button>
                    <button type="button" class="btn btn-primary" id="nextButton">
                        Siguiente Escenario
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <!-- IndexedDB -->
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <script>
        // Register the datalabels plugin globally
        Chart.register(ChartDataLabels);
        
    </script>
    <!-- Modular JavaScript -->
    <script type="module" src="js/slider.js"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>

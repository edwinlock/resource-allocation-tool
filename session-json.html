<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session JSON View</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared Styles -->
    <link href="css/shared-styles.css" rel="stylesheet">

    <style>
        body {
            font-family: monospace;
            margin: 20px;
            line-height: 1.4;
        }
        .json-container {
            white-space: pre-wrap;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            font-size: 12px;
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }
        .copy-btn {
            margin-bottom: 15px;
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .copy-btn:hover {
            background: #0056b3;
        }
        h2 {
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Upload Data JSON</h2>
            <button type="button" class="btn btn-outline-secondary" onclick="window.close()">Close</button>
        </div>

        <div class="alert alert-info" id="sessionInfo" style="display: none;">
            <strong>Session ID:</strong> <span id="sessionIdDisplay"></span>
        </div>

        <button class="copy-btn" onclick="copyToClipboard()">
            📋 Copy to Clipboard
        </button>

        <div id="json-data" class="json-container">
            Loading session data...
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- IndexedDB -->
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

    <script type="module">
        import { sessionManager } from './js/modules/session-coordinator.js';

        document.addEventListener('DOMContentLoaded', async () => {
            // Get session ID from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId');

            if (!sessionId) {
                document.getElementById('json-data').textContent = 'Error: No session ID provided';
                return;
            }

            try {
                // Display session ID
                document.getElementById('sessionIdDisplay').textContent = sessionId;
                document.getElementById('sessionInfo').style.display = 'block';

                // Load and display session data
                const data = await sessionManager.aggregateSessionData(sessionId);
                const jsonString = JSON.stringify(data, null, 2);
                document.getElementById('json-data').textContent = jsonString;

                // Store for clipboard copy
                window.jsonData = jsonString;

            } catch (error) {
                document.getElementById('json-data').textContent = `Error loading session data: ${error.message}`;
            }
        });

        window.copyToClipboard = function() {
            if (window.jsonData) {
                navigator.clipboard.writeText(window.jsonData).then(() => {
                    const btn = document.querySelector('.copy-btn');
                    const originalText = btn.textContent;
                    btn.textContent = '✓ Copied!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                }).catch(() => {
                    alert('Could not copy to clipboard');
                });
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey - Resource Allocation Study</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Resource Tool">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Theme Color for iOS -->
    <meta name="theme-color" content="#007bff">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/slider.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <div class="row app-container">
            <div class="col-12">
                <div class="session-info mb-3">
                    <small>Session ID: <span id="session-id">-</span> | Participant: <span id="participant-id">-</span> | Enumerator: <span id="enumerator-id">-</span></small>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading survey...</span>
                    </div>
                    <p class="mt-3 text-muted">Loading survey...</p>
                </div>

                <!-- Error State -->
                <div id="errorState" class="alert alert-danger" style="display: none;">
                    <h4 class="alert-heading">⚠️ Error Loading Survey</h4>
                    <p id="errorMessage">An error occurred while loading the survey.</p>
                    <hr>
                    <a href="index.html" class="btn btn-primary">Return to Session Manager</a>
                </div>

                <!-- Survey Content -->
                <div id="surveyContent" style="display: none;">
                    <!-- Survey will be rendered here -->
                </div>

                <!-- Success State -->
                <div id="successState" class="text-center py-5" style="display: none;">
                    <div class="alert alert-success">
                        <h4 class="alert-heading">✅ Survey Completed!</h4>
                        <p>Thank you for completing the survey. Your responses have been saved.</p>
                        <hr>
                        <a href="index.html" class="btn btn-primary">Return to Session Manager</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- IndexedDB -->
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

    <!-- Survey JavaScript -->
    <script type="module">
        // Import UI management for survey page
        import './js/modules/ui-survey.js';
    </script>

    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./js/sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
